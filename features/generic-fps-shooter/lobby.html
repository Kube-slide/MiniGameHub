<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generic FPS Shooter</title>
    <link rel="stylesheet" href="lobby.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <script src="./lobby.js" defer type="module"></script>
  </head>
  <body>
    <div class="overlay"></div>

    <header>
      <a
        href="https://github.com/Kube-slide"
        class="fab fa-github github-icon"
      ></a>
    </header>

    <main class="menu-container">
      <h1 class="game-title">Generic FPS Shooter</h1>

      <div class="button-group">
        <a href="./in-game/game.html" class="menu-btn">FIND LOBBY</a>
        <a class="menu-btn" id="controls-btn">CONTROLS</a>
      </div>
    </main>

    <div id="controls-modal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>OPERATOR CONTROLS</h2>
        <div class="control-grid">
          <div class="control-item">
            <span class="action">MOVEMENT</span>
            <div class="keys">
              <span class="key">W</span><span class="key">A</span
              ><span class="key">S</span><span class="key">D</span>
            </div>
          </div>
          <div class="control-item">
            <span class="action">AIM / LOOK</span>
            <span class="key wide">MOUSE</span>
          </div>
          <div class="control-item">
            <span class="action">FIRE</span>
            <span class="key wide">LEFT CLICK</span>
          </div>
          <div class="control-item">
            <span class="action">JUMP</span>
            <span class="key wide">SPACE</span>
          </div>
          <div class="control-item">
            <span class="action">MENU / UNLOCK</span>
            <span class="key wide">ESC</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
