<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplayer FPS</title>
    <script src="./game.js" type="module" defer></script>
    <link href="./game.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="pause-menu">
      <div class="menu-card">
        <h1>PAUSED</h1>

        <div class="mp-container">
          <div class="id-display">
            <small>MY ID:</small>
            <span id="my-peer-id">Generating...</span>
          </div>

          <div class="join-row">
            <input
              type="text"
              id="join-id"
              placeholder="Paste Friend's ID Here"
            />
            <button id="join-btn">JOIN</button>
          </div>
          <div id="status-msg"></div>
        </div>

        <hr />

        <button id="resume-btn" class="primary-btn">RESUME</button>
        <button id="quit-btn" class="danger-btn">QUIT</button>
      </div>
    </div>
    <div class="crosshair"></div>
  </body>
</html>
